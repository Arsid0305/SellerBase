# Supabase local config. Используется CLI при деплое функций.
project_id = "hcebwgjgppwaguqittpi"

# verify_jwt = true — Supabase сам проверяет Authorization: Bearer <JWT> до того
# как функция запустится. Cron jobs шлют service_role JWT из Vault (см. миграцию
# 20260621100001_cron_with_service_role_jwt.sql). Внутри функции ещё одна
# проверка X-Cron-Secret (см. _shared/auth.ts) — два слоя защиты.
#
# Исключения с verify_jwt = false:
#   • telegram-webhook — Telegram шлёт свой апдейт, JWT отсутствует.

[functions.fetch-wb-stocks]
verify_jwt = true

[functions.sync-sheets]
verify_jwt = true

[functions.telegram-webhook]
# Telegram присылает свой апдейт, Supabase JWT отсутствует.
verify_jwt = false

[functions.send-notification]
verify_jwt = true

[functions.fetch-wb-funnel]
verify_jwt = true

[functions.fetch-wb-funnel-aggregate]
verify_jwt = true

[functions.fetch-wb-promotions]
verify_jwt = true

[functions.fetch-wb-tariffs]
verify_jwt = true

[functions.fetch-wb-report]
verify_jwt = true

[functions.telegram-alerts]
verify_jwt = true

[functions.fetch-wb-content]
verify_jwt = true

[functions.fetch-wb-sales]
verify_jwt = true

[functions.fetch-wb-goods-returns]
