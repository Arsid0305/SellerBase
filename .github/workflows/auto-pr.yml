name: Auto-open PR for claude branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check if PR already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          count=$(gh pr list --repo ${{ github.repository }} \
            --head "$BRANCH" --base main --state open --json number --jq 'length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Existing open PRs from $BRANCH → main: $count"

      - name: Create PR if missing
        if: steps.check.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Берём первую строку последнего коммита как заголовок PR
          title=$(echo "$COMMIT_MSG" | head -n1)
          # Если ветка тестовая или техническая — дефолтный заголовок
          if [ -z "$title" ]; then
            title="auto: $BRANCH"
          fi
          gh pr create --repo ${{ github.repository }} \
            --base main \
            --head "$BRANCH" \
            --title "$title" \
            --body "Авто-PR (workflow auto-pr.yml). Открыт после push в \`$BRANCH\`. Последний коммит:\n\n\`\`\`\n${COMMIT_MSG}\n\`\`\`"
