name: Auto-merge claude/cursor branches

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  automerge:
    runs-on: ubuntu-latest
    # Skip draft PRs — they cannot be merged via API (returns 405) and pollute CI history.
    # When PR is marked Ready for Review, the `ready_for_review` event re-triggers this job.
    if: >
      github.event.pull_request.draft == false &&
      (startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'cursor/'))
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash'
            })
