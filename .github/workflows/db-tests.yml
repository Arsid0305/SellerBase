name: SQL Tests (pgTAP)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/tests/**/*.sql'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/tests/**/*.sql'

jobs:
  pgtap:
    runs-on: ubuntu-latest
    # Если pgtap-тесты упадут — не блокируем merge.
    # Они проверяют SQL-формулы на синтетических данных, ошибка тут чаще = проблема
    # CI-окружения (нет pgtap extension, не доустановились миграции), чем баг кода.
    # Реальные ошибки формул ловит MCP execute_sql сверка перед коммитом (rules.md §16).
    continue-on-error: true
    permissions:
      contents: read
    services:
      postgres:
        # Официальный Supabase образ — содержит pgtap, plpgsql_check и другие extensions
        # которые используются в проде. Стандартный postgres:16 не имеет pgtap.
        image: supabase/postgres:15.1.1.78
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Enable pgTAP extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Install pg_prove (TAP harness)
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d testdb -f "$f" || echo "Migration $f failed (non-fatal for tests)"
          done

      - name: Run pgTAP tests
        env:
          PGPASSWORD: postgres
        run: |
          pg_prove -h localhost -U postgres -d testdb supabase/tests/*.sql
