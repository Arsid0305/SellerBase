name: SQL Tests (pgTAP)

on:
  pull_request:
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/tests/**/*.sql'
      - '.github/workflows/db-tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**/*.sql'
      - 'supabase/tests/**/*.sql'

jobs:
  pgtap:
    runs-on: ubuntu-latest
    # continue-on-error снят 11.09.2026. Он стоял потому, что в чистом
    # контейнере не применялись 46 миграций из 139 — не хватало ролей,
    # pg_net, pg_cron и объектов, созданных в проде мимо репозитория.
    # Теперь среда готовится supabase/ci/test-bootstrap.sql, недостающие
    # объекты добавлены миграцией 0099, и база собирается целиком.
    # Красные тесты снова блокируют мерж.
    permissions:
      contents: read
    services:
      postgres:
        # Официальный Supabase образ — содержит pgtap, plpgsql_check и другие extensions
        # которые используются в проде. Стандартный postgres:16 не имеет pgtap.
        image: supabase/postgres:15.1.1.78
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - name: Enable pgTAP extension
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -c "CREATE EXTENSION IF NOT EXISTS pgtap;"

      - name: Install pg_prove (TAP harness)
        run: |
          sudo apt-get update
          sudo apt-get install -y libtap-parser-sourcehandler-pgtap-perl postgresql-client

      - name: Prepare test environment
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d testdb -v ON_ERROR_STOP=1 \
            -f supabase/ci/test-bootstrap.sql

      - name: Apply migrations
        env:
          PGPASSWORD: postgres
        run: |
          failed=0
          for f in supabase/migrations/*.sql; do
            if ! psql -h localhost -U postgres -d testdb -v ON_ERROR_STOP=1 -q -f "$f" 2>/tmp/err.log; then
              failed=$((failed + 1))
              echo "::error file=$f::Миграция не применилась"
              head -3 /tmp/err.log
            fi
          done
          echo "Не применилось миграций: $failed"

      # Тесты проверяют вьюхи и функции. Если их нет, pg_prove покажет
      # «функция не найдена» вместо настоящей проверки формулы — раньше
      # это и происходило. Здесь падаем сразу и по делу.
      - name: Verify schema objects tests rely on
        env:
          PGPASSWORD: postgres
        run: |
          missing=0
          for obj in v_turnover_by_sku v_sku_lifecycle v_data_quality; do
            if ! psql -h localhost -U postgres -d testdb -tAc "select to_regclass('public.$obj')" | grep -q .; then
              echo "::error::Нет объекта $obj"; missing=$((missing + 1))
            fi
          done
          for fn in get_pnl_by_period get_daily_pnl_series; do
            if [ "$(psql -h localhost -U postgres -d testdb -tAc "select count(*) from pg_proc p join pg_namespace n on n.oid = p.pronamespace where n.nspname = 'public' and p.proname = '$fn'")" = "0" ]; then
              echo "::error::Нет функции $fn"; missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "Схема собралась не полностью: не хватает $missing объектов."
            exit 1
          fi

      - name: Run pgTAP tests
        env:
          PGPASSWORD: postgres
        run: |
          pg_prove -h localhost -U postgres -d testdb supabase/tests/*_tests.sql
