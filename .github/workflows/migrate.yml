# Apply Supabase migrations to the production database.
#
# Triggers:
#   - push to main when files under supabase/migrations/ change
#   - manual via workflow_dispatch
#
# Required GitHub secrets:
#   - SBP_ACCESS_TOKEN       Supabase personal access token (already used by deploy.yml)
#   - SUPABASE_PROJECT_REF   Supabase project ref / id (already used by deploy.yml)
#   - SUPABASE_DB_PASSWORD   Database password for `supabase db push` (NEW — add if missing)
#
# Behavior:
#   `supabase db push --include-all` applies every migration in
#   supabase/migrations/ that has not yet been recorded in the remote
#   `supabase_migrations.schema_migrations` table. Already-applied
#   migrations are skipped automatically.

name: Apply Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**/*.sql'
      - '.github/workflows/migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SBP_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.5

      - name: List local migrations
        run: |
          echo "Migrations present in repo:"
          ls -1 supabase/migrations/*.sql || echo "(none)"

      - name: Link Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Repair migration history (mark remote-only as applied) + create stubs
        # Имена локальных файлов миграций исторически в формате 0004_xxx / 20260604_xxx — несовместимом
        # с timestamp-форматом записей в supabase_migrations.schema_migrations (14-цифровые).
        # MCP `apply_migration` тоже создаёт записи с timestamp current_time без соответствующего файла.
        # CLI отказывается делать push если remote/local расходятся:
        #   1) `migration repair --status applied` — помечает запись в remote table (no-op если уже applied).
        #   2) ВДОБАВОК создаём stub-файл `<version>_stub_remote_only.sql` (комментарий) — `db push`
        #      сверяет remote с local *файлами*, repair'а недостаточно. Stubs идемпотентны.
        # Список = SELECT version FROM supabase_migrations.schema_migrations ORDER BY version.
        # При появлении новых MCP-миграций — расширять.
        run: |
          set -e
          VERSIONS="20260528183520 20260528223249 20260528224925 20260528225004 20260528225024 20260528225056
                    20260529082554 20260529083929 20260529084434 20260529140435 20260530090942 20260530133404
                    20260601191042 20260601191137 20260604192601 20260604192617 20260604192626 20260604192638
                    20260605024138 20260605065121 20260605065139 20260605080643 20260605081930 20260605082433
                    20260605143622 20260605205731 20260605205858 20260605210646 20260605212040 20260610081949
                    20260610182319 20260611191737 20260611205237 20260611210258 20260611210657 20260611211755
                    20260611212705 20260611215008 20260611215316 20260611220657 20260611221328 20260612122532
                    20260612123417 20260612124414 20260612190154 20260613185105 20260613191053 20260614080830
                    20260614202142 20260614211005 20260614213807 20260614232012 20260614233049 20260615161535
                    20260618072707 20260618072713 20260618072724 20260618072732 20260618072739 20260618223903
                    20260619084302 20260619085233 20260619171941 20260619171949 20260619172733 20260619172759
                    20260619225915 20260619230817 20260619231005 20260619231129 20260619231141 20260620075216
                    20260620075239 20260620075302 20260620075319 20260620102415 20260620133740 20260620202314
                    20260620202332 20260620214737 20260621072537 20260621072933 20260621073226 20260621073543
                    20260621073846 20260621073904 20260621074138 20260621074359 20260621074658 20260622145242
                    20260622145353 20260624162336"
          for v in $VERSIONS; do
            supabase migration repair --status applied "$v" || true
            STUB="supabase/migrations/${v}_stub_remote_only.sql"
            if ! ls "supabase/migrations/${v}_"*.sql >/dev/null 2>&1; then
              echo "-- stub for remote-only migration $v (applied via MCP apply_migration)" > "$STUB"
            fi
          done

      - name: Push migrations (apply unapplied only)
        # Password передаётся через env SUPABASE_DB_PASSWORD (job-level) — supabase CLI читает её сам, без флага в argv.
        run: supabase db push --include-all
